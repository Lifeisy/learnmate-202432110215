spring:
  datasource:
    url: jdbc:h2:mem:learnmate_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  h2:
    console:
      enabled: false

learnmate:
  ai:
    enabled: false
    api-key: ""
  jwt:
    secret: test-only-secret-key-for-learnmate-integration-tests-123456
    expire-minutes: 30

logging:
  level:
    root: WARN
